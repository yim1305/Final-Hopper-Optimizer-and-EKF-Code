# Active Astro inputs. Landing ground is assumed flat at DEM-derived elevation.
common:
  moon:
    mu: 4902800000000.0
    radius: 1737400.0
    omega: 2.6617e-06
  g0: 9.80665
  sites:
    start:
      lat: -85.5
      lon: -87.1
      elev: 0.0
    target:
      lat: -78.82668404226864
      lon: -85.95852077297914
      elev: 0.0
  vehicle:
    m_wet: 5000.0
    m_dry: 2000.0
  mission:
    propellant_reserve_factor: 1.1
    mode: size
    divert_radius: 150.0
    landing_tolerance: 25.0
    gate_alt_bounds:
    - 150.0
    - 1500.0
    gate_over_target: true
  sensor:
    fov_deg:
    - 90.0
    - 90.0
    max_range: 10000.0
    min_altitude: 5.0
    descent_speed_bounds:   # PLACEHOLDER: 5 m/s vertical cap in observation (was 100); sensitivity-study value, not a requirement
    - 0.1
    - 5.0
    horizontal_speed_max: 100.0
    pointing_rate_max_deg_s: 30.0
    observation_time_min: 5.0   # PLACEHOLDER: 5 s observation (was 1 s); sensitivity-study value, not a requirement
    processing_delay: 0.1
    edge_margin_deg: 0.0
    enforce_pointing: true
  limits:
    h_rise: 50.0
    min_altitude: 50.0
    glide_slope_deg: 35.0
    tilt_rate_max_deg_s: 6.0
    td_vert_speed_max: 1.5
    td_horiz_speed_max: 0.5
    td_tilt_max_deg: 30.0
    phase_duration_bounds:
      rise:
      - 1
      - 120
      ascent:
      - 1
      - 600
      coast:
      - 1
      - 2000
      braking:
      - 1
      - 600
      observation:
      - 0.1
      - 300
      terminal:
      - 1
      - 300
    stage_duration_min: 0.1
  solver:
    nodes:
      rise: 10
      ascent: 540
      coast: 120
      braking: 180
      observation: 36   # was 12: at 12 nodes the thrust direction turns 7.15 deg/s between nodes (> 6 deg/s limit)
      terminal: 150
    seed_nodes:
      rise: 6
      ascent: 16
      coast: 12
      braking: 16
      observation: 6
      terminal: 24
    ipopt:
      max_iter: 1000
      max_wall_time: 60.0
      tol: 1.0e-08
      constr_viol_tol: 1.0e-08
  star_tracker:
    enabled: true
    n_trackers: 2
    mount_model: independent_top
    antipodal: false
    top_plane_fov_clearance_margin_deg: 0.0
    full_cone_fov_deg: 20.0
    sun_exclusion_deg: 23.5
    earth_exclusion_deg: 23.5
    bright_body_exclusion_reference: boresight_to_center
    moon_limb_margin_deg: 0.0
    moon_limb_reference: fov_edge
    tracking_body_rate_max_deg_s: 6.0
    enforce_body_rate: true
    update_gap_max_s: 5.0
    acquisition_time_s: 0.0
    switching_delay_s: 0.0
    initial_estimate_age_s: 0.0
    required_phase_kinds:
    - ascent
    - coast
    body_roll_policy: projected_downrange
    coast_attitude_policy: inertial_endpoint_slerp
    mount_search:
      elevation_bounds_deg:
      - - 10.0
        - 90.0
      - - 10.0
        - 90.0
      paired_azimuth_bounds_deg:
      - - 0.0
        - 360.0
      - - 0.0
        - 360.0
      initial_elevations_deg:
      - 72.66012643997279
      - 54.935656370286914
      initial_azimuths_deg:
      - 0.0
      - 180.0
      tilt_bounds_deg:
      - 0.0
      - 90.0
      azimuth_bounds_deg:
      - 0.0
      - 360.0
      coarse_step_deg: 10.0
    assumed_geometry:
      label: synthetic_launch_aligned_geometry_not_ephemeris
      earth_direction_I:
      - 1.0
      - 0.0
      - 0.0
      sun_direction_I:
      - 0.05059294007671333
      - -0.9987193571841863
      - 0.0
      directions_frozen_in: I
      surface_stay_s: 0.0
    analysis:
      sample_step_s: 0.05
      transition_time_tolerance_s: 0.001
cases:
  a2200_08:
    architecture: a2200
    count: 8
  a2200_10:
    architecture: a2200
    count: 10
  a2200_12:
    architecture: a2200
    count: 12
  a2200_14:
    architecture: a2200
    count: 14
  ar46_leros_rcs:
    architecture: ar46_leros_rcs
analysis:
  branch: uprange
  camera_ray_intervals: 20
  independent_sample_step_s: 0.05
  contact_position_tolerance_m: 0.05
  contact_time_tolerance_s: 0.05
  base_antenna_height_above_dem_m: 2.0
  hopper_antenna_radial_offset_m: 2.0
  coarse_time_step_s: 0.5
  coarse_ray_step_m: 15.0
  fine_time_step_s: 0.25
  fine_ray_step_m: 7.5
  surface_stay_duration_s: null
  minimum_elevation_mask_deg: null
  terrain_uncertainty_margin_m: null
descent_variant:
  # Descent-thrust settings of the current final run (set a value to null to turn it off).
  # scripts/run_descent_variant.py overrides these.
  thrust_floor_n: 2224.0   # PLACEHOLDER: user-specified floor for floor_phases on both hops (never raises a floor).
                           # Assumption: 2224 N below the 4448 N 4-engine floor = two engines shut off, two at 50 %.
  floor_phases: [observation, terminal]
  touchdown_thrust_to_weight_max: 1.0   # thrust / local weight limit at the last node of each hop
  solve_pointing_rate_deg_s: 5.0        # numerical margin: the optimizer caps observation pointing at this rate;
                                        # the independent camera check still uses the real 6 deg/s
tracker_solver:
  # Numerical discretization; physical tracker limits remain in common.star_tracker.
  seed_event_step_s: 1.0
  ray_step_m: 240.0
  cone_rings: 1
  cone_azimuths: 8
  ray_length_seed_factor: 1.1
  global_crop_pad_deg: 1.0
  max_refinement_attempts: 3
engine_types:
  a2200:
    classes:
      a2200:
        count: 8
        thrust: 2224.0
        isp: 318.0
        pulsing: false
        throttle_min_fraction: 0.5
        mixture_ratio: 1.45
        throttle_rate_fraction_s: 0.16666666666666666
    pulse_min_fraction: 0.02
    pools:
      rise:
      - a2200
      ascent:
      - a2200
      braking:
      - a2200
      observation:
      - a2200
      terminal:
      - a2200
    stages:
      rise:
      - a2200: 8
      ascent:
      - a2200: 8
      - a2200: 6
      - a2200: 4
      braking:
      - a2200: 8
      - a2200: 6
